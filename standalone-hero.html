<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
  <link rel="mask-icon" href="/favicon.svg" color="#f97316" />
  <title>Scroll-Driven Canvas Hero Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Scroll section defining page scroll distance */
    .hero-scroll-container {
      position: relative;
      width: 100%;
      height: 400vh; /* 400vh scroll height */
      background-color: #000000;
    }

    /* Fixed full viewport frame */
    .hero-fixed-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      z-index: 1;
      pointer-events: none;
    }

    /* Cover-fit canvas */
    .hero-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    /* Minimal loading percentage overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .loading-percentage {
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Hero Scroll Section -->
  <section id="hero-animation" class="hero-scroll-container">
    <div class="hero-fixed-frame">
      <canvas id="hero-canvas" class="hero-canvas"></canvas>
    </div>
  </section>

  <!-- Preloading Percentage Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <span id="loading-percentage" class="loading-percentage">0%</span>
  </div>

  <script>
    (function () {
      const FRAME_COUNT = 146;
      const FIRST_FRAME = 2; // ezgif-frame-002.jpg to ezgif-frame-147.jpg
      const FRAMES_DIR = '/q/';

      const container = document.getElementById('hero-animation');
      const canvas = document.getElementById('hero-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const loadingOverlay = document.getElementById('loading-overlay');
      const loadingPercentage = document.getElementById('loading-percentage');

      const frames = new Array(FRAME_COUNT);
      let targetFrame = 0;
      let currentFrame = 0;
      let drawnFrame = -1;
      let isVisible = true;
      let rafId = null;
      let loadedCount = 0;

      function getFrameFilename(index) {
        const frameNum = index + FIRST_FRAME;
        const paddedNum = String(frameNum).padStart(3, '0');
        return `${FRAMES_DIR}ezgif-frame-${paddedNum}.jpg`;
      }

      // Fast direct 1:1 GPU blit
      function drawFrame(frameIndex) {
        const bitmap = frames[frameIndex];
        if (!bitmap) return;
        ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const displayW = window.innerWidth;
        const displayH = window.innerHeight;

        const pixelW = Math.round(displayW * dpr);
        const pixelH = Math.round(displayH * dpr);

        if (canvas.width !== pixelW || canvas.height !== pixelH) {
          canvas.width = pixelW;
          canvas.height = pixelH;
        }
        drawnFrame = -1; // Force redraw on resize
      }

      function updateTargetFrame() {
        const rect = container.getBoundingClientRect();
        const totalScrollable = rect.height - window.innerHeight;
        if (totalScrollable <= 0) return;

        const scrolled = -rect.top;
        const progress = Math.min(1, Math.max(0, scrolled / totalScrollable));
        targetFrame = progress * (FRAME_COUNT - 1);
      }

      // Smooth Momentum Easing (Lerp) Render Loop
      function renderLoop() {
        if (isVisible) {
          const diff = targetFrame - currentFrame;
          if (Math.abs(diff) > 0.001) {
            currentFrame += diff * 0.25; // 0.25 responsive lerp
          } else {
            currentFrame = targetFrame;
          }

          const frameToDraw = Math.min(FRAME_COUNT - 1, Math.max(0, Math.round(currentFrame)));

          if (frameToDraw !== drawnFrame) {
            drawFrame(frameToDraw);
            drawnFrame = frameToDraw;
          }

          rafId = requestAnimationFrame(renderLoop);
        } else {
          rafId = null;
        }
      }

      function startLoop() {
        if (!rafId) {
          rafId = requestAnimationFrame(renderLoop);
        }
      }

      function stopLoop() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Preload & Offscreen GPU Pre-render
      function preloadImages() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.min(Math.round(window.innerWidth * dpr), 1920);
        const targetH = Math.min(Math.round(window.innerHeight * dpr), 1080);

        const offscreen = document.createElement('canvas');
        offscreen.width = targetW;
        offscreen.height = targetH;
        const offCtx = offscreen.getContext('2d', { alpha: false });

        for (let i = 0; i < FRAME_COUNT; i++) {
          const img = new Image();
          img.src = getFrameFilename(i);

          const handleLoad = async () => {
            try {
              if (img.decode) {
                try {
                  await img.decode();
                } catch (e) {}
              }

              const iw = img.naturalWidth || 1920;
              const ih = img.naturalHeight || 1080;
              const scale = Math.max(targetW / iw, targetH / ih);
              const dw = iw * scale;
              const dh = ih * scale;
              const dx = (targetW - dw) / 2;
              const dy = (targetH - dh) / 2;

              offCtx.fillStyle = '#000';
              offCtx.fillRect(0, 0, targetW, targetH);
              offCtx.drawImage(img, dx, dy, dw, dh);

              if ('createImageBitmap' in window) {
                const bitmap = await createImageBitmap(offscreen);
                frames[i] = bitmap;
              } else {
                frames[i] = img;
              }
            } catch (err) {
              frames[i] = img;
            }

            loadedCount++;
            const pct = Math.round((loadedCount / FRAME_COUNT) * 100);
            loadingPercentage.textContent = pct + '%';

            if (loadedCount === FRAME_COUNT) {
              loadingOverlay.style.opacity = '0';
              setTimeout(() => {
                loadingOverlay.style.display = 'none';
              }, 300);
              drawnFrame = -1;
            }
          };

          img.onload = handleLoad;
          img.onerror = handleLoad;
        }
      }

      // Intersection Observer
      const observer = new IntersectionObserver(([entry]) => {
        isVisible = entry.isIntersecting;
        if (entry.isIntersecting) {
          updateTargetFrame();
          resizeCanvas();
          startLoop();
        } else {
          stopLoop();
        }
      }, { threshold: 0 });

      observer.observe(container);

      // Event listeners (passive scroll)
      window.addEventListener('scroll', updateTargetFrame, { passive: true });
      window.addEventListener('resize', () => {
        resizeCanvas();
        updateTargetFrame();
      });

      // Initialize
      resizeCanvas();
      updateTargetFrame();
      preloadImages();
    })();
  </script>
</body>
</html>
